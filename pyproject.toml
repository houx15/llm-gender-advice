[project]
name = "advice-audit"
version = "0.1.0"
description = "Different or Lesser? LLM gender bias in major and career advice — API behavioral audit (Part A) and offline interpretability pipeline (Part B)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "typer>=0.12",
    "pandas>=2.2",
    "pyarrow>=15.0",
    "numpy>=1.26",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
api = [
    "httpx>=0.27",
    "tenacity>=8.2",
]
analysis = [
    "statsmodels>=0.14",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "openpyxl>=3.1",
    "xlrd>=2.0",
    "lxml>=5.0",
    "pypdf>=4.0",
    "httpx>=0.27",
    "scikit-learn>=1.4",
]
local = [
    "torch>=2.3",
    "transformers>=4.46",
    "accelerate>=0.33",
    "safetensors>=0.4",
    "datasets>=2.19",
    "scikit-learn>=1.4",
    "concept-erasure>=0.2",
    "huggingface_hub>=0.24",
    "vllm>=0.6; sys_platform == 'linux'",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "tokenizers>=0.19",
]

[project.scripts]
advice-audit = "advice_audit.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/advice_audit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
