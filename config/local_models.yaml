# Open-weight models for Part B (spec §6.2). Pin `revision` to a commit hash after
# `scripts/online/cache_models.py` resolves it. repo_ids are TODO on purpose — see QUESTIONS.md.
models:
  - key: qwen38_27b
    repo_id: TODO            # confirm exact HF repo id for Qwen3.8 27B (open weights)
    revision: TODO           # pin commit hash after caching
    dtype: bfloat16
    role: main               # same family as an API model
    chat_template_kwargs: {enable_thinking: false}
  - key: western_mid
    repo_id: TODO            # researcher picks a Western open-weight model, ~8–32B
    revision: TODO
    dtype: bfloat16
    role: main
    chat_template_kwargs: {}
  - key: small_iter
    repo_id: TODO            # 7–9B model for fast iteration
    revision: TODO
    dtype: bfloat16
    role: dev
    chat_template_kwargs: {}
# Shared local settings
generation:
  max_new_tokens: 800
  temperature: 0.7           # Step 0 sampling (greedy for steering/erasure comparisons)
  top_p: 0.95
extraction:
  positions: [name_last, cue_last, last]   # token positions captured per prompt
  layers: all                              # or a list of ints
  batch_size: 8
  warn_storage_gb: 50
readout:
  answer_prefix: {en: "My top recommendation is:", zh: "我最推荐的是："}
  batch_size: 16
